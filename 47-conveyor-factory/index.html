<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@hyperframes/core/dist/hyperframe.runtime.iife.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "./_atlas/vendor/three/three.module.min.js",
          "three/addons/": "./_atlas/vendor/three/addons/"
        }
      }
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #e9e6de; }
      [data-composition-id="main"] { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #e9e6de; }
      #stage { position: absolute; inset: 0; display: block; width: 1920px; height: 1080px; }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">
      <canvas id="stage" class="clip" width="1920" height="1080" data-start="0" data-duration="15" data-track-index="0"></canvas>
      <audio id="sfx" data-start="0" data-duration="15" data-track-index="2" data-volume="1" src="sfx.wav"></audio>
    </div>
    <script>
      // Three.js owns all motion (driven by hf-seek); HyperFrames still requires a registered timeline.
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
    <script type="module" src="./scene.js"></script>
  </body>
</html>
